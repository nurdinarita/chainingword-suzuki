<style>
  html, body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    width: 100%;
    height: 100%;
    overflow: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: url('imgs/guests.jpg') no-repeat center center fixed;
    background-size: cover;
  }

  h2 {
    margin: 20px 0;
    font-size: 3vw;
    text-align: center;
    color: white;
    text-shadow: 1px 1px 5px rgba(0,0,0,0.7);
  }

  .table-wrapper {
    width: 70%;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: 40%;
    margin-bottom: 60px;
  }

  .table-container {
    width: 100%;
    max-height: 40vh; /* atau px kalau mau fix height, misalnya 500px */
    overflow-y: auto; /* bikin scroll vertikal */
    overflow-x: auto; /* scroll horizontal kalau kolom terlalu lebar */
  }

  .table-container thead th {
    position: sticky;
    top: 0;
    z-index: 2;
    background: #0051ac; /* sama seperti style header */
    color: white;
  }


  table {
    border-collapse: collapse;
    width: 100%;
    font-size: 1.5vw;
    background: rgba(255,255,255,0.9);
  }

  th, td {
    border: 1px solid #ccc;
    padding: 0.5em 1em;
    text-align: left;
  }

  th {
    background: #0051ac;
    color: white;
    font-size: 1.8vw;
  }

  tr:nth-child(even) {
    background: rgba(249,249,249,0.9);
  }

  .btn {
    padding: 1em 2em;
    font-size: 2vw;
    color: white;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    white-space: nowrap;
  }

  #back-btn {
    background: #ffffff;
    color:#111;
  }

  #back-btn:hover {
    background: #218838;
  }

  #download-btn {
    background: #ff0000;
  }

  #download-btn:hover {
    background: #cc0000;
  }

  /* Container tombol sejajar */
  .btn-wrapper {
    width: 100%;
    display: flex;
    justify-content: space-between; /* Back kiri, Download kanan */
    margin-top: 40px;
    margin-bottom: 20px;
  }

  #qrcode-wrapper {
    display: flex;
    justify-content: center;
    width: 100%;
    margin-top: 20px;
    margin-bottom: 60px;
  }

  /* TV besar 2160x3840 */
  @media (min-width: 2000px) {
    h2 { font-size: 64px; }
    table { font-size: 32px; }
    th { font-size: 36px; }
    .btn { font-size: 36px; padding: 20px 40px; }
    #qrcode-wrapper { margin-top: 40px; margin-bottom: 100px; }
  }

  /* Mobile */
  @media (max-width: 1024px) {
    .table-wrapper { width: 95%; margin-top: 20px; }
    #qrcode-wrapper { display: none !important; }
    table { font-size: 16px; min-width: 100%; }
    .btn { font-size: 18px; padding: 10px 20px; }
  }
</style>

<body>
  <div class="table-wrapper">
    <div class="table-container">
      <table id="guests-table">
        <thead>
          <tr id="table-header"></tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>

    <!-- Tombol sejajar -->
    <div class="btn-wrapper">
      <button id="download-btn" class="btn">Download Data Hari Ini</button>
       <button id="back-btn" class="btn">Back to Home</button>
    </div>

    <!-- QR code di bawah tombol -->
    <div id="qrcode-wrapper">
      <div id="qrcode"></div>
    </div>
  </div>

  <script src="/js/qrcode.min.js"></script>
  <script>
    fetch("/api/server-ip")
      .then(res => res.json())
      .then(data => {
        const url = `http://${data.ip}:${data.port}/guests`;
        new QRCode(document.getElementById("qrcode"), {
          text: url,
          width: 256,
          height: 256
        });
      })
      .catch(err => console.error("Gagal ambil IP server:", err));

    async function loadGuests() {
      try {
        const res = await fetch("/api/guests");
        const data = await res.json();

        if (data.length === 0) {
          document.getElementById("table-body").innerHTML =
            "<tr><td colspan='4'>Belum ada data tamu</td></tr>";
          return;
        }

        const headers = Object.keys(data[0]);
        const headerRow = document.getElementById("table-header");
        headerRow.innerHTML = headers.map(h => `<th>${h}</th>`).join("");

        const tbody = document.getElementById("table-body");
        tbody.innerHTML = "";
        data.forEach(row => {
          const tr = document.createElement("tr");
          tr.innerHTML = headers.map(h => `<td>${row[h] || ""}</td>`).join("");
          tbody.appendChild(tr);
        });
      } catch (err) {
        console.error("Gagal load guests:", err);
      }
    }

    document.getElementById("back-btn").addEventListener("click", () => {
      window.location.href = "/settings";
    });

    document.getElementById("download-btn").addEventListener("click", () => {
      const today = new Date().toISOString().slice(0,10); 
      window.location.href = `/api/guests/download-today?date=${today}`;
    });

    loadGuests();
  </script>
</body>
