<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <title>Pengaturan Game Lengkap</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        /* background: linear-gradient(to bottom, #ff1a1a, #000); */
        background: url("../../public/chainingword-suzuki/bg-setting.jpg")
          no-repeat center center fixed;
        background-size: cover;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
      }
      h1 {
        color: #fff;
        text-shadow: 4px 4px 12px rgba(0, 0, 0, 0.9);
        font-size: clamp(48px, 8vw, 96px);
        margin-bottom: 50px;
        text-align: center;
        letter-spacing: 2px;
      }
      form {
        background: rgba(0, 0, 0, 0.75);
        border: 4px solid #fff;
        border-radius: 40px;
        padding: 60px 80px;
        box-shadow: 0 12px 40px rgba(255, 0, 0, 0.5);
        width: 85%;
        max-width: 1600px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 50px;
      }
      .group {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 40px;
        width: 100%;
      }
      label {
        display: flex;
        flex-direction: column;
        color: #fff;
        font-size: clamp(28px, 3vw, 56px);
      }
      input[type="number"] {
        margin-top: 12px;
        width: 77%;
        font-size: clamp(26px, 3vw, 56px);
        padding: 20px 30px;
        border-radius: 20px;
        border: 4px solid #fff;
        background: #111;
        color: #fff;
        outline: none;
        transition: 0.2s;
      }
      textarea {
        margin-top: 12px;
        width: 100%;
        font-size: clamp(24px, 2.4vw, 40px);
        padding: 20px 30px;
        border-radius: 20px;
        border: 4px solid #fff;
        background: #111;
        color: #fff;
        outline: none;
        min-height: 240px;
        resize: vertical;
      }
      input:focus,
      textarea:focus {
        border-color: #ff4d4d;
        box-shadow: 0 0 20px rgba(255, 77, 77, 0.7);
      }
      .button-container {
        display: flex;
        justify-content: center;
        gap: 30px;
        flex-wrap: wrap;
        margin-top: 20px;
      }
      button {
        padding: 20px 60px;
        font-size: clamp(24px, 3vw, 48px);
        border: 4px solid #fff;
        border-radius: 20px;
        background: transparent;
        color: #fff;
        cursor: pointer;
        transition: all 0.3s ease;
        letter-spacing: 1px;
      }
      button:hover {
        transform: scale(1.05);
        background: #fff;
        color: #000;
      }
      button.save {
        border-color: #ff4d4d;
      }
      button.guest {
        border-color: #00ff9d;
      }
      button.back {
        border-color: #aaa;
      }

      .popup {
        position: fixed;
        top: 10%;
        left: 50%;
        transform: translateX(-50%) translateY(-30px);
        background: #111;
        color: #fff;
        border: 3px solid #ff4d4d;
        border-radius: 20px;
        padding: 40px 80px;
        font-size: clamp(24px, 3vw, 48px);
        text-align: center;
        box-shadow: 0 0 25px rgba(255, 0, 0, 0.6);
        opacity: 0;
        transition: all 0.5s ease;
        z-index: 1000;
      }
      .popup.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    </style>
  </head>
  <body>
    <div>
      <h1>Pengaturan Game Lengkap</h1>

      <form id="settingsForm">
        <div class="group">
          <label
            >Countdown
            <input type="number" id="countdownGame" min="0" step="1" />
          </label>
          <label
            >Kencang
            <input type="number" id="kencang" min="0" step="1" />
          </label>
          <label
            >Sedang
            <input type="number" id="sedang" min="0" step="1" />
          </label>
        </div>

        <div class="group">
          <label
            >Kecil
            <input type="number" id="kecil" min="0" step="1" />
          </label>
          <label
            >Point 1
            <input type="number" id="point1" min="0" step="1" />
          </label>
          <label
            >Point 2
            <input type="number" id="point2" min="0" step="1" />
          </label>
        </div>

        <div class="group">
          <label
            >Point 3
            <input type="number" id="point3" min="0" step="1" />
          </label>
          <label
            >Rows
            <input type="number" id="rows" min="1" step="1" />
          </label>
          <label
            >Cols
            <input type="number" id="cols" min="1" step="1" />
          </label>
        </div>

        <div class="group">
          <label style="grid-column: 1 / span 3">
            Words
            <textarea
              id="words"
              placeholder="1:
FESTARIC
STIMUNO

2:
SELOXY
OXYVIT"
            ></textarea>
          </label>
        </div>

        <div class="button-container">
          <button type="submit" class="save">Save</button>
          <button type="button" class="guest">Guests</button>
          <button type="button" class="back">Back</button>
        </div>
      </form>
    </div>

    <div id="popup" class="popup"></div>

    <script>
      // Popup
      function showPopup(message, isError = false) {
        const popup = document.getElementById("popup");
        popup.textContent = message;
        popup.style.borderColor = isError ? "#ff0000" : "#00ff9d";
        popup.style.boxShadow = isError
          ? "0 0 30px rgba(255,0,0,0.7)"
          : "0 0 30px rgba(0,255,157,0.6)";
        popup.classList.add("show");
        setTimeout(() => popup.classList.remove("show"), 2500);
      }

      // Get URL event
      function getPaths() {
        const parts = window.location.pathname.split("/").filter(Boolean);
        const event = parts[parts.length - 2] || parts[parts.length - 1];
        const baseUrl = `${window.location.origin}/${parts.slice(0, -1).join("/")}`;
        return { event, baseUrl };
      }
      const { event, baseUrl } = getPaths();

      // Load config
      async function loadConfig() {
        try {
          const res = await fetch(`/config/${event}.json`, {
            cache: "no-store",
          });
          if (!res.ok) throw new Error(`${event}.json tidak ditemukan`);
          const data = await res.json();

          [
            "countdownGame",
            "kencang",
            "sedang",
            "kecil",
            "point1",
            "point2",
            "point3",
            "rows",
            "cols",
          ].forEach((id) => {
            if (data[id] !== undefined)
              document.getElementById(id).value = data[id];
          });

          if (Array.isArray(data.words)) {
            // Jika multi-set → gabungkan untuk preview
            if (Array.isArray(data.words[0])) {
              document.getElementById("words").value = data.words
                .map((set, i) => `${i + 1}:\n${set.join("\n")}`)
                .join("\n\n");
            } else {
              document.getElementById("words").value = data.words.join("\n");
            }
          }
        } catch (err) {
          showPopup("⚠️ " + err.message, true);
        }
      }

      // Save config
      document
        .getElementById("settingsForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const numberIds = [
            "countdownGame",
            "kencang",
            "sedang",
            "kecil",
            "point1",
            "point2",
            "point3",
            "rows",
            "cols",
          ];
          const newValues = {};

          numberIds.forEach((id) => {
            const val = document.getElementById(id).value;
            if (val !== "") newValues[id] = Number(val);
          });

          // ⭐ MULTI-SET PARSER — SIMPAN SEMUA SET
          const raw = document.getElementById("words").value.trim();
          let wordsArr = [];

          if (raw.length > 0) {
            // Pisah berdasarkan baris seperti: "1:" , "2:" , "3:"
            const parts = raw
              .split(/^\s*\d+\s*:\s*$/m)
              .map((s) => s.trim())
              .filter(Boolean);

            if (parts.length > 1) {
              // Multi-set
              parts.forEach((block) => {
                const list = block
                  .split(/\n+/)
                  .map((w) => w.trim().toUpperCase())
                  .filter(Boolean);
                if (list.length > 0) wordsArr.push(list);
              });
            } else {
              // Single set
              wordsArr.push(
                raw
                  .split(/[\n,]+/)
                  .map((w) => w.trim().toUpperCase())
                  .filter(Boolean),
              );
            }
          }

          if (wordsArr.length > 0) newValues.words = wordsArr;

          try {
            const resOld = await fetch(`/config/${event}.json`, {
              cache: "no-store",
            });
            const oldConfig = await resOld.json();

            const updated = { ...oldConfig, ...newValues };

            const res = await fetch(`/update-config/${event}`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(updated),
            });

            if (!res.ok) throw new Error("Gagal menyimpan config");

            showPopup("Pengaturan berhasil disimpan!");
          } catch (err) {
            showPopup(err.message, true);
          }
        });

      // Buttons
      document
        .querySelector(".guest")
        .addEventListener(
          "click",
          () => (window.location.href = `${baseUrl}/guests`),
        );
      document
        .querySelector(".back")
        .addEventListener("click", () => (window.location.href = baseUrl));

      // Init
      loadConfig();
    </script>
  </body>
</html>
